<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase 2 · 미니 React 검증</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <h1>Phase 2 · 컴포넌트 / Hooks 검증</h1>
    <p class="muted">왼쪽은 미니 React로 그린 앱, 오른쪽은 미니 React 밖에서 기록하는 검증 로그입니다.</p>
  </header>

  <main class="layout">
    <!-- 미니 React가 그리는 영역 -->
    <div id="app"></div>

    <!-- 미니 React 밖의 일반 DOM: 앱이 다시 그려져도 영향받지 않음 -->
    <aside class="panel side">
      <h2>검증 로그</h2>

      <div class="stats">
        <div><span class="label">렌더 횟수</span><strong id="stat-renders">0</strong></div>
        <div><span class="label">useMemo 계산 횟수 (R7)</span><strong id="stat-memo">0</strong></div>
        <div><span class="label">R6 effect 실행 횟수</span><strong id="stat-effect">0</strong></div>
      </div>

      <h3>마지막 렌더의 실제 DOM 조작 <small>(R3)</small></h3>
      <p id="stat-dom" class="mono">아직 없음</p>

      <h3>구현 규칙 3-3: hook 순서 검사 <small>(오류가 나야 정상)</small></h3>
      <div class="row">
        <button id="btn-bad-order" type="button">조건문 안의 hook</button>
        <button id="btn-bad-outside" type="button">컴포넌트 밖의 hook</button>
      </div>

      <h3>이벤트 기록</h3>
      <button id="btn-clear-log" type="button" class="small">기록 지우기</button>
      <ol id="log" class="log"></ol>
    </aside>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
