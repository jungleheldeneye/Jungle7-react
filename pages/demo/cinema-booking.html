<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>정글 극장 · 좌석 예매</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #101118;
      --panel: #191b25;
      --surface: #242735;
      --line: #3b4053;
      --text: #f6f5fa;
      --muted: #b5b9cc;
      --accent: #f6ce83;
      --accent-ink: #291c06;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 1rem/1.55 system-ui, sans-serif;
    }
    h1, h2, p { margin: 0; }
    button { font: inherit; }
    button:enabled { cursor: pointer; }
    button:focus-visible { outline: 2px solid white; outline-offset: 2px; }
    .shell { width: min(100% - 32px, 86rem); margin-inline: auto; padding-block: 24px 48px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    #booking { min-width: 0; container-type: inline-size; }
    #react-inspector { min-width: 0; position: sticky; inset-block-start: 16px; }
    .booking-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-block-end: 14px; }
    .booking-heading h1 { font-size: 1.25rem; }
    .muted { color: var(--muted); }
    .booking-grid { display: grid; gap: 16px; align-items: start; }
    @container (min-width: 39rem) {
      .booking-grid { grid-template-columns: minmax(0, 1.6fr) minmax(14rem, 1fr); }
    }
    .panel { min-width: 0; padding: clamp(12px, 3vw, 24px); border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
    .panel h2 { font-size: 1.2rem; }
    .panel-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
    .small { font-size: .875rem; }
    .screen {
      width: 85%;
      margin: 24px auto 20px;
      padding-block: 8px 0;
      border-block-start: 3px solid #c7bedf;
      border-radius: 45% 45% 0 0;
      color: var(--muted);
      text-align: center;
      font-size: .75rem;
      letter-spacing: .2em;
    }
    .seat-map { display: grid; gap: 8px; }
    .seat-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)) clamp(6px, 2vw, 20px) repeat(3, minmax(0, 1fr));
      gap: clamp(4px, 1vw, 8px);
    }
    .seat {
      min-width: 0;
      min-height: 44px;
      padding: 0;
      border: 1px solid #626981;
      border-radius: 8px 8px 5px 5px;
      background: var(--surface);
      color: var(--text);
      font-size: .875rem;
      font-weight: 650;
    }
    .seat:nth-child(4) { grid-column: 5; }
    .seat--premium { border-color: #a797d5; }
    .seat:enabled:hover { border-color: var(--accent); }
    .seat[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    .seat:disabled { border-color: var(--line); background: #161720; color: #9b9fb4; text-decoration: line-through; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-block-start: 16px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: .75rem; height: .75rem; border: 1px solid #626981; border-radius: 3px; background: var(--surface); }
    .legend .premium { border-color: #a797d5; }
    .legend .picked { border-color: var(--accent); background: var(--accent); }
    .legend .booked i { border-color: var(--line); background: #161720; }
    .hold { color: var(--accent); font-variant-numeric: tabular-nums; }
    .summary-body { margin-block: 16px; }
    .summary-body ul { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
    .price-line { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 12px; }
    .total { padding-block: 14px; border-block-start: 1px solid var(--line); }
    .total strong { color: var(--accent); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .notice { margin-block-end: 12px; color: var(--accent); }
    .notice:empty { margin: 0; }
    .actions { display: grid; gap: 8px; }
    .action {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-weight: 650;
    }
    .action--primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    .action:disabled { border-color: var(--line); background: #272936; color: var(--muted); }
    .inspector {
      display: grid;
      gap: 16px;
      word-break: keep-all;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }
    .inspector-action { display: grid; gap: 10px; }
    .inspector-event { font-size: 1.125rem; font-weight: 700; }
    .inspector-event code { margin-inline-start: 8px; color: var(--muted); font-size: .8125rem; }
    .inspector-flow { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .inspector-flow li {
      padding: 8px 12px;
      border-inline-start: 2px solid var(--line);
      background: var(--background);
    }
    .inspector-flow code, .inspector-metric code { color: var(--muted); font-size: .8125rem; }
    .inspector-flow .state-change { border-inline-start-color: var(--accent); }
    .inspector-flow strong { color: var(--accent); }
    .inspector-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .inspector-metric {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--background);
    }
    .inspector-metric.changed { border-color: var(--accent); }
    .inspector-value { font-weight: 700; }
    .inspector-metric.changed .inspector-value { color: var(--accent); }
    .inspector-vdom {
      padding-block-start: 10px;
      border-block-start: 1px solid var(--line);
    }
    .inspector-vdom summary { cursor: pointer; font-size: .875rem; }
    .inspector-vdom pre {
      max-height: min(45dvh, 24rem);
      overflow: auto;
      margin: 8px 0 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: .8125rem/1.55 ui-monospace, monospace;
    }
    @media (max-width: 52rem) {
      .workspace { grid-template-columns: minmax(0, 1fr); }
      #react-inspector { position: static; }
    }
  </style>
</head>
<body>
  <main class="shell workspace">
    <div id="booking"></div>
    <div id="react-inspector"></div>
  </main>
  <noscript>좌석을 예매하려면 자바스크립트를 켜 주세요.</noscript>

  <script type="module">
    import { FunctionComponent } from '../../src/component.js';
    import { diff } from '../../src/diff.js';
    import { h } from '../../src/vdom.js';
    import { useEffect, useMemo, useState } from '../../src/hooks.js';

    const HOLD_SECONDS = 20;
    const TIMER_SOURCE = '타이머 갱신';
    const NUMBER = new Intl.NumberFormat('ko-KR');
    const STANDARD = { label: '일반석', price: 10000 };
    const PREMIUM = { label: '프리미엄석', price: 14000 };
    const ROWS = ['A', 'B', 'C', 'D'].map((row, index) =>
      Array.from({ length: 6 }, (_, column) => ({
        id: `${row}${column + 1}`,
        tier: index < 2 ? STANDARD : PREMIUM,
      })),
    );
    const SEATS = ROWS.flat();

    function formatPrice(price) {
      return `${NUMBER.format(price)}원`;
    }

    function remainingTime(deadline, now = Date.now()) {
      return Math.max(0, Math.ceil((deadline - now) / 1000));
    }

    function formatTime(seconds) {
      return [Math.floor(seconds / 60), seconds % 60].map((part) => String(part).padStart(2, '0')).join(':');
    }

    function summarize(selectedIds) {
      const seats = SEATS.filter(({ id }) => selectedIds.includes(id));
      return { seats, total: seats.reduce((total, seat) => total + seat.tier.price, 0) };
    }

    function clearSelection(booking, expired = false) {
      return { ...booking, selectedIds: [], deadline: null, seconds: 0, receipt: null, expired };
    }

    function setBookingFrom(setBooking, source, update) {
      setBooking((current) => {
        const next = update(current);
        return next === current ? current : { ...next, source };
      });
    }

    function SeatMap({ selectedIds, bookedIds, onSelect }) {
      return h('section', { class: 'panel', 'aria-labelledby': 'seat-heading' },
        h('div', { class: 'panel-heading' },
          h('h2', { id: 'seat-heading' }, '좌석 선택'),
          h('p', { class: 'muted small' }, `예매 가능 ${SEATS.length - bookedIds.length}석`),
        ),
        h('p', { class: 'screen' }, 'SCREEN'),
        h('div', { class: 'seat-map' }, ROWS.map((row) =>
          h('div', { class: 'seat-row' }, row.map(({ id, tier }) => {
            const selected = selectedIds.includes(id);
            const booked = bookedIds.includes(id);
            const label = `${id} ${tier.label}, ${booked ? '예매 완료' : formatPrice(tier.price)}`;
            return h('button', {
              type: 'button',
              class: tier === PREMIUM ? 'seat seat--premium' : 'seat',
              'data-seat': id,
              'aria-label': label,
              'aria-pressed': booked ? undefined : String(selected),
              disabled: booked ? '' : undefined,
              onclick: onSelect,
            }, id);
          })),
        )),
        h('div', { class: 'legend small' },
          h('span', {}, h('i', { 'aria-hidden': 'true' }), `일반석 ${formatPrice(STANDARD.price)}`),
          h('span', {}, h('i', { class: 'premium', 'aria-hidden': 'true' }), `프리미엄석 ${formatPrice(PREMIUM.price)}`),
          h('span', {}, h('i', { class: 'picked', 'aria-hidden': 'true' }), '선택'),
          h('span', { class: 'booked' }, h('i', { 'aria-hidden': 'true' }), '예매 완료'),
        ),
      );
    }

    function BookingSummary({ summary, receipt, seconds, expired, onConfirm, onClear }) {
      const { seats, total } = receipt ?? summary;
      return h('section', { class: 'panel', 'aria-labelledby': 'summary-heading' },
        h('div', { class: 'panel-heading' },
          h('h2', { id: 'summary-heading' }, receipt ? '예매 완료' : '예매 요약'),
          h('p', { class: 'hold small', role: receipt ? undefined : 'timer' },
            receipt ? '2관 · 19:30' : seconds > 0 ? `남은 시간 ${formatTime(seconds)}` : `선택 시 ${HOLD_SECONDS}초간 유지`,
          ),
        ),
        h('div', { class: 'summary-body' }, seats.length > 0
          ? h('ul', { 'aria-label': '좌석 내역' }, seats.map(({ id, tier }) =>
              h('li', { class: 'price-line' },
                h('span', {}, `${id} · ${tier.label}`),
                h('span', { class: 'muted' }, formatPrice(tier.price)),
              ),
            ))
          : h('p', { class: 'muted' }, '좌석을 고르면 여기에 표시돼요.'),
        ),
        h('p', { class: 'price-line total', 'aria-live': 'polite', 'aria-atomic': 'true' },
          h('span', {}, `${seats.length}석 합계`),
          h('strong', { id: 'booking-total' }, formatPrice(total)),
        ),
        h('p', { class: 'notice small', role: 'status' }, expired
          ? '선택 시간이 끝났어요. 좌석을 다시 골라 주세요.'
          : receipt ? '선택한 좌석의 모의 예매가 완료됐어요.' : null,
        ),
        h('div', { class: 'actions' },
          h('button', {
            type: 'button', class: 'action action--primary', onclick: onConfirm,
            disabled: seats.length === 0 ? '' : undefined,
          }, receipt ? '다른 좌석 고르기' : '예매 확정'),
          seats.length > 0 && !receipt
            ? h('button', { type: 'button', class: 'action', onclick: onClear }, '선택 비우기')
            : null,
        ),
      );
    }

    function BookingApp() {
      const [booking, setBooking] = useState({
        selectedIds: [], bookedIds: ['A2', 'B5', 'D4'],
        deadline: null, seconds: 0, receipt: null, expired: false,
      });
      const { selectedIds, bookedIds, deadline, seconds, receipt, expired } = booking;
      const summary = useMemo(() => summarize(selectedIds), [selectedIds]);

      // 첫 렌더의 setter도 함수형 업데이트로 항상 현재 상태를 읽는다.
      const actions = useMemo(() => ({
        onSelect(event) {
          const id = event.currentTarget.dataset.seat;
          setBookingFrom(setBooking, `${id} 좌석 클릭`, (current) => {
            if (current.bookedIds.includes(id)) return current;
            const now = Date.now();
            const active = current.deadline !== null && current.deadline <= now ? clearSelection(current) : current;
            const ids = active.selectedIds.includes(id)
              ? active.selectedIds.filter((selected) => selected !== id)
              : [...active.selectedIds, id];
            if (ids.length === 0) return clearSelection(active);
            const nextDeadline = active.deadline ?? now + HOLD_SECONDS * 1000;
            return {
              ...active, selectedIds: ids, deadline: nextDeadline,
              seconds: remainingTime(nextDeadline, now), receipt: null, expired: false,
            };
          });
        },
        onClear() {
          setBookingFrom(setBooking, '선택 비우기', clearSelection);
        },
        onConfirm(event) {
          setBookingFrom(setBooking, event.currentTarget.textContent, (current) => {
            if (current.receipt) return clearSelection(current);
            if (current.selectedIds.length === 0) return current;
            if (remainingTime(current.deadline) === 0) return clearSelection(current, true);
            return {
              ...clearSelection(current),
              bookedIds: [...current.bookedIds, ...current.selectedIds],
              receipt: summarize(current.selectedIds),
            };
          });
        },
      }), []);

      useEffect(() => {
        if (deadline === null) return;
        const timer = setInterval(() => {
          setBookingFrom(setBooking, TIMER_SOURCE, (current) => {
            if (current.deadline !== deadline) return current;
            const nextSeconds = remainingTime(deadline);
            if (nextSeconds === 0) return clearSelection(current, true);
            return nextSeconds === current.seconds ? current : { ...current, seconds: nextSeconds };
          });
        }, 200);
        return () => clearInterval(timer);
      }, [deadline]);

      useEffect(() => {
        publishInspection(booking, summary);
      }, [booking, summary]);

      return h('div', {},
        h('header', { class: 'booking-heading' },
          h('h1', {}, '영화관 좌석 예매'),
          h('p', { class: 'muted small' }, '오늘 19:30 · 2관'),
        ),
        h('div', { class: 'booking-grid' },
          h(SeatMap, { selectedIds, bookedIds, onSelect: actions.onSelect }),
          h(BookingSummary, { summary, receipt, seconds, expired, onConfirm: actions.onConfirm, onClear: actions.onClear }),
        ),
      );
    }

    let setInspection;

    function ReactInspector() {
      const [snapshot, setSnapshot] = useState(null);
      const [expanded, setExpanded] = useState(false);
      const onToggle = useMemo(() => (event) => setExpanded(event.currentTarget.open), []);
      useEffect(() => {
        setInspection = setSnapshot;
        return () => { setInspection = undefined; };
      }, []);

      const { action, timer, price, vnode, patchCount } = snapshot ?? {};
      return h('aside', { class: 'panel inspector', 'aria-labelledby': 'inspector-heading' },
        h('h2', { id: 'inspector-heading' }, '화면이 바뀌는 과정'),
        action ? h(BookingAction, { action }) : h('p', { class: 'muted' }, '좌석을 골라 화면이 바뀌는 과정을 확인해 보세요.'),
        snapshot ? h('div', { class: 'inspector-metrics' },
          h(InspectorMetric, { label: '남은 시간', hook: 'useEffect', ...timer }),
          h(InspectorMetric, { label: '선택 좌석 합계', hook: 'useMemo', ...price }),
        ) : null,
        h('details', { class: 'inspector-vdom', ontoggle: onToggle },
          h('summary', {}, '현재 VDOM 보기', patchCount === null || patchCount === undefined
            ? null : h('span', { class: 'muted' }, ` · 최근 Diff ${patchCount}건`)),
          expanded && vnode ? h('pre', { tabindex: '0', 'aria-label': '현재 예매 화면의 VDOM' },
            JSON.stringify(vnode, (_, value) => typeof value === 'function' ? '[함수]' : value, 2),
          ) : null,
        ),
      );
    }

    function BookingAction({ action }) {
      const { source, before, after, seatChange, summaryChange, patchCount } = action;
      return h('section', { class: 'inspector-action', 'aria-label': '마지막 예매 동작' },
        h('p', { class: 'inspector-event' }, source, h('code', {}, 'setBooking()')),
        h('ol', { class: 'inspector-flow' },
          h('li', { class: 'state-change' },
            h('code', {}, 'useState'), h('p', {}, '선택 좌석 ', h('span', { class: 'muted' }, `${before} → `), h('strong', {}, after))),
          h('li', {},
            h('p', {}, h('code', {}, 'SeatMap'), ' · ', seatChange),
            h('p', {}, h('code', {}, 'BookingSummary'), ' · ', summaryChange)),
          h('li', {}, h('p', {}, `새 VDOM → Diff ${patchCount}건 → DOM 반영`)),
        ),
      );
    }

    function InspectorMetric({ label, hook, before, value, status }) {
      return h('section', { class: before === null ? 'inspector-metric' : 'inspector-metric changed', 'aria-label': label },
        h('p', { class: 'small muted' }, label),
        h('p', {},
          before === null ? null : h('span', { class: 'small muted' }, `${before} → `),
          h('span', { class: 'inspector-value' }, value)),
        h('p', { class: 'small' }, h('code', {}, hook), ' · ', status),
      );
    }

    function timerEffectStatus(deadline, previousDeadline) {
      if (deadline === null) return '타이머 정리';
      return previousDeadline === null ? '타이머 시작' : '타이머 재시작';
    }

    function describeBookingAction(previous, booking, memo, patchCount) {
      const { selectedIds, bookedIds, receipt, source } = booking;
      const added = selectedIds.filter((id) => !previous.booking.selectedIds.includes(id));
      const removed = previous.booking.selectedIds.filter((id) => !selectedIds.includes(id));
      const booked = bookedIds.filter((id) => !previous.booking.bookedIds.includes(id));
      const seatChanges = [
        booked.length && `${booked.join(', ')} 예매 완료`,
        added.length && `${added.join(', ')} 선택`,
        !booked.length && removed.length && `${removed.join(', ')} 선택 해제`,
      ].filter(Boolean);
      const summary = receipt ?? memo;
      const oldTotal = (previous.booking.receipt ?? previous.memo).total;
      const total = oldTotal === summary.total
        ? formatPrice(summary.total) : `${formatPrice(oldTotal)} → ${formatPrice(summary.total)}`;
      return {
        source,
        before: previous.booking.selectedIds.join(', ') || '없음',
        after: selectedIds.join(', ') || '없음',
        seatChange: seatChanges.join(' · ') || '좌석 변경 없음',
        summaryChange: `${receipt ? '예매 완료 · ' : ''}${summary.seats.length}석 · ${total}`,
        patchCount,
      };
    }

    const bookingApp = new FunctionComponent(BookingApp);
    let previous;
    let lastAction = null;
    let timerStatus = '타이머 대기';

    function publishInspection(booking, memo) {
      const { deadline, seconds, expired, source } = booking;
      const { vnode } = bookingApp;
      const patchCount = previous ? diff(previous.vnode, vnode).length : null;
      if (previous && source && source !== TIMER_SOURCE) {
        lastAction = describeBookingAction(previous, booking, memo, patchCount);
      }
      if (previous && deadline !== previous.booking.deadline) {
        timerStatus = timerEffectStatus(deadline, previous.booking.deadline);
      }

      const previousSeconds = previous?.booking.seconds;
      const previousTotal = previous?.memo.total;
      const timer = {
        before: source === TIMER_SOURCE && !expired && seconds !== previousSeconds ? formatTime(previousSeconds) : null,
        value: expired ? '시간 만료' : deadline === null ? '대기' : formatTime(seconds),
        status: timerStatus,
      };
      const price = {
        before: previous && memo.total !== previousTotal ? formatPrice(previousTotal) : null,
        value: formatPrice(memo.total),
        status: memo === previous?.memo ? '재사용' : previous ? '다시 계산' : '초기 계산',
      };
      previous = { booking, memo, vnode };
      setInspection?.({ action: lastAction, timer, price, vnode, patchCount });
    }

    const inspector = new FunctionComponent(ReactInspector);
    inspector.mount(document.getElementById('react-inspector'));
    bookingApp.mount(document.getElementById('booking'));
  </script>
</body>
</html>
